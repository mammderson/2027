<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#003b5c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keep the site (and the organizers' names) out of search results. The link is shared on Slack and WhatsApp.
         Don't also block crawlers in a robots.txt: they'd never load the page, so they'd never see this tag. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>MAMMDERSON 2027</title>
    <meta name="description" content="MAMMDERSON 2027: FEMBA weekend at Mammoth Mountain, January 22–24, 2027." />

    <!-- Link previews (WhatsApp, iMessage, Slack). These URLs must be absolute; update them if the site address changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MAMMDERSON 2027" />
    <meta property="og:description" content="FEMBA weekend at Mammoth Mountain, January 22–24, 2027. Lodging, PJ party, activities, FAQ and more." />
    <meta property="og:url" content="https://mammderson.github.io/" />
    <!-- The M logo on white. A new filename (not og-image.jpg) also makes apps fetch it fresh instead of reusing a cached preview. -->
    <meta property="og:image" content="https://mammderson.github.io/og-logo.jpg" />
    <meta property="og:image:width" content="1000" />
    <meta property="og:image:height" content="1000" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
